  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <!-- lidar sweep decoration -->
  <g fill="none" stroke="#58a6ff" opacity="0.12">
    <circle cx="1120" cy="160" r="260" stroke-width="1.5"/>
    <circle cx="1120" cy="160" r="190" stroke-width="1.5"/>
    <circle cx="1120" cy="160" r="120" stroke-width="1.5"/>
    <path d="M1120 160 L1280 60" stroke-width="2" opacity="0.5"/>
    <path d="M1120 160 L1240 300" stroke-width="2" opacity="0.5"/>
  </g>
  <g fill="#58a6ff">
    <circle cx="1272" cy="55" r="4" opacity="0.8"/>
    <circle cx="1236" cy="296" r="4" opacity="0.8"/>
    <circle cx="1120" cy="-100" r="4" opacity="0.4"/>
    <circle cx="900" cy="80" r="4" opacity="0.4"/>
    <circle cx="980" cy="300" r="4" opacity="0.4"/>
  </g>
  <!-- rover glyph -->
  <g transform="translate(72,96)">
    <g fill="none" stroke="#58a6ff" stroke-width="3" opacity="0.4">
      <path d="M64 64 L150 20"/>
      <path d="M64 64 L160 118"/>
    </g>
    <rect x="18" y="40" width="92" height="64" rx="14" fill="#1f6feb" stroke="#58a6ff" stroke-width="3"/>
