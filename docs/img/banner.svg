  <!-- title -->
  <text x="300" y="150" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="64" font-weight="800" fill="#e6edf3">vacuum<tspan fill="#58a6ff">-</tspan>rover</text>
  <text x="302" y="196" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="24" fill="#8b949e">4WD rover from two dead robot vacuums · ROS 2 · stereo vision · 3D-printed frame</text>
